<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14476b">
<title>Dasbor Pengasuh — PPDT</title>
<meta name="description" content="Dasbor kehadiran, perizinan, dan keuangan santri PPDT Darut Thalibin.">
<style>
  :root{
    --biru:#14476b; --biru2:#1c6ea4; --hijau:#1e8e3e; --kuning:#f29900; --merah:#d93025;
    --abu:#5f6368; --garis:#e3e6ea; --bg:#f4f6f8; --putih:#fff; --radius:14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:#1f2328;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:15px; line-height:1.45; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:760px;margin:0 auto;padding:12px 12px 48px;}
  .kartu{background:var(--putih);border:1px solid var(--garis);border-radius:var(--radius);padding:16px;margin-top:12px;}
  .judul{font-weight:700;font-size:16px;margin:0 0 2px;}
  .sub{font-size:12px;color:var(--abu);}

  /* ---- kop ---- */
  header.kop{
    background:linear-gradient(150deg,#14476b 0%,#1c6ea4 100%);
    border-radius:var(--radius); padding:18px; color:#fff; position:relative; overflow:hidden;
  }
  header.kop:after{
    content:""; position:absolute; right:-40px; top:-40px; width:160px; height:160px;
    background:rgba(255,255,255,.07); border-radius:50%;
  }
  .lembaga{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;opacity:.78;}
  .kop h1{font-size:21px;margin:4px 0 0;font-weight:700;letter-spacing:-.01em;}
  .kop .meta{font-size:12px;opacity:.85;margin-top:4px;}
  .kop .baris{
    display:flex;justify-content:space-between;align-items:center;
    margin-top:12px;padding-top:10px;border-top:1px solid rgba(255,255,255,.22);
    font-size:11.5px;opacity:.85;
  }
  .pil{background:rgba(255,255,255,.16);border-radius:20px;padding:3px 10px;font-size:10.5px;}

  /* ---- navigasi bulan ---- */
  .nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:12px 0 0;}
  .nav a{
    text-decoration:none;color:var(--biru2);background:var(--putih);border:1px solid var(--garis);
    border-radius:22px;padding:7px 14px;font-size:13px;font-weight:600;
  }
  .nav a.nonaktif{opacity:.35;pointer-events:none;}
  .nav .tengah{font-weight:700;font-size:14px;}

  /* ---- KPI ---- */
  .kpi{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;}
  .kpi .kartu{margin-top:0;padding:14px;}
  .kpi .label{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--abu);}
  .kpi .angka{font-size:27px;font-weight:700;line-height:1.15;margin-top:3px;letter-spacing:-.02em;}
  .kpi .angka span{font-size:13px;font-weight:400;color:var(--abu);letter-spacing:0;}
  .kpi .ket{font-size:11.5px;color:var(--abu);margin-top:2px;}

  /* ---- peringatan ---- */
  .alarm{border-left:4px solid var(--merah);}
  .alarm.tandai{border-left-color:var(--kuning);}
  .alarm .t{font-weight:700;color:var(--merah);font-size:14.5px;}
  .alarm.tandai .t{color:#b06000;}
  .alarm .item{
    font-size:13px;margin-top:8px;padding-left:11px;border-left:2px solid #fce8e6;
  }
  .alarm .item b{font-weight:600;}
  .alarm .item .d{display:block;color:var(--abu);font-size:11.5px;}
  .alarm .kaki{font-size:11.5px;color:var(--abu);margin-top:10px;}
  .bersih{background:#e6f4ea;border:1px solid #ceead6;border-radius:var(--radius);padding:13px 15px;
          margin-top:12px;font-size:13.5px;color:#137333;font-weight:600;}

  /* ---- batang ---- */
  .bar{margin:11px 0;}
  .bar .atas{display:flex;justify-content:space-between;align-items:baseline;font-size:13.5px;margin-bottom:4px;}
  .bar .nilai{font-weight:700;}
  .bar .jalur{background:#e9ecef;border-radius:6px;height:10px;overflow:hidden;}
  .bar .isi{height:100%;border-radius:6px;transition:width .5s ease;}
  .bar .ket{font-size:11.5px;color:var(--abu);margin-top:3px;}

  /* ---- grafik ---- */
  .grafik{width:100%;display:block;margin-top:6px;}
  .grafik .label-tgl{font-size:9px;fill:var(--abu);}
  .grafik .label-nilai{font-size:9px;fill:#9aa0a6;}

  /* ---- daftar ---- */
  .baris-daftar{display:flex;justify-content:space-between;align-items:center;gap:10px;
    padding:9px 0;border-bottom:1px solid #f1f3f4;font-size:13.5px;}
  .baris-daftar:last-child{border-bottom:0;}
  .baris-daftar .kanan{font-weight:700;white-space:nowrap;}
  .baris-daftar .kanan .ket{font-weight:400;color:var(--abu);font-size:11.5px;}
  .kosong{font-size:13px;color:var(--abu);}

  /* ---- keadaan ---- */
  .tengah-layar{min-height:70vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;}
  .tengah-layar .dalam{max-width:420px;}
  .tengah-layar h1{font-size:19px;color:var(--biru);margin:0 0 8px;}
  .tengah-layar p{color:var(--abu);font-size:14px;margin:0 0 6px;}
  .tengah-layar .ikon{font-size:38px;margin-bottom:10px;}
  .muat{background:#eef1f4;border-radius:8px;height:14px;animation:denyut 1.2s infinite ease-in-out;}
  @keyframes denyut{0%,100%{opacity:.55}50%{opacity:1}}

  footer{margin-top:20px;text-align:center;font-size:11.5px;color:var(--abu);line-height:1.7;}
  footer b{color:#3c4043;}
  .tombol-cetak{background:var(--putih);border:1px solid var(--garis);border-radius:22px;
    padding:8px 16px;font-size:13px;font-weight:600;color:var(--biru2);cursor:pointer;margin-top:14px;}

  @media (min-width:620px){
    .kpi{grid-template-columns:repeat(4,1fr);}
    .kop h1{font-size:24px;}
  }
  @media print{
    body{background:#fff;}
    .nav,.tombol-cetak,footer .cetak{display:none;}
    .kartu{break-inside:avoid;}
  }
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="tengah-layar"><div class="dalam">
    <div class="ikon">⏳</div>
    <h1>Memuat dasbor…</h1>
    <p>Sedang mengambil data terbaru dari pondok.</p>
  </div></div>
</div>

<script>
(function () {
  'use strict';

  var $app = document.getElementById('app');
  var PARAM = new URLSearchParams(location.search);

  // ---- token: sekali dari tautan, lalu disimpan di perangkat ----
  var token = PARAM.get('t');
  if (token) {
    try { localStorage.setItem('ppdt_token', token); } catch (e) {}
    // bersihkan token dari address bar supaya tidak ikut terkirim ke mana-mana
    if (history.replaceState) {
      PARAM.delete('t');
      var q = PARAM.toString();
      history.replaceState({}, '', location.pathname + (q ? '?' + q : ''));
    }
  } else {
    try { token = localStorage.getItem('ppdt_token'); } catch (e) { token = null; }
  }

  if (!token) {
    layarPesan('🔑', 'Butuh tautan pribadi',
      'Halaman ini dibuka lewat tautan yang diberikan pengurus pondok.',
      'Kalau tautanmu hilang, minta lagi ke pengurus — setiap pengasuh punya tautan sendiri.');
    return;
  }

  var bulan = PARAM.get('bulan') || '';
  var NAMA_BULAN = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
  function namaBulanSingkat(b) {
    return NAMA_BULAN[Number(b.slice(5,7)) - 1] + ' ' + b.slice(2,4);
  }

  function layarPesan(ikon, judul, isi, tambahan) {
    $app.innerHTML =
      '<div class="tengah-layar"><div class="dalam">' +
      '<div class="ikon">' + ikon + '</div><h1>' + esc(judul) + '</h1>' +
      '<p>' + esc(isi) + '</p>' + (tambahan ? '<p style="margin-top:10px">' + esc(tambahan) + '</p>' : '') +
      '</div></div>';
  }

  function esc(s) {
    return String(s === undefined || s === null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function warna(n) { return n >= 75 ? 'var(--hijau)' : (n >= 50 ? 'var(--kuning)' : 'var(--merah)'); }

  function rupiah(n) {
    n = Math.round(Number(n) || 0);
    return 'Rp ' + String(n).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  }

  function bar(label, persen, ket, w) {
    var p = Math.max(0, Math.min(100, Number(persen) || 0));
    return '<div class="bar">' +
      '<div class="atas"><span>' + esc(label) + '</span>' +
      '<span class="nilai" style="color:' + (w || warna(p)) + '">' + p + '%</span></div>' +
      '<div class="jalur"><div class="isi" style="width:' + p + '%;background:' + (w || warna(p)) + '"></div></div>' +
      (ket ? '<div class="ket">' + esc(ket) + '</div>' : '') +
      '</div>';
  }

  // ---- grafik tren (SVG dibuat di sini, bukan dari server) ----
  function grafikTren(tren) {
    if (!tren || !tren.length) return '<div class="kosong">Belum ada catatan pada periode ini.</div>';
    var W = 640, H = 150, kiri = 26, bawah = 28, atas = 16;
    var n = tren.length;
    var langkah = (W - kiri - 10) / Math.max(1, n - 1);
    function y(v) { return atas + (100 - v) * (H - bawah - atas) / 100; }

    var s = '<svg class="grafik" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="xMidYMid meet">';
    [0,25,50,75,100].forEach(function (v) {
      s += '<line x1="' + kiri + '" y1="' + y(v).toFixed(1) + '" x2="' + (W-10) + '" y2="' + y(v).toFixed(1) +
           '" stroke="#eef0f3" stroke-width="1"/>' +
           '<text class="label-nilai" x="0" y="' + (y(v)+3).toFixed(1) + '">' + v + '</text>';
    });
    s += '<line x1="' + kiri + '" y1="' + y(50).toFixed(1) + '" x2="' + (W-10) + '" y2="' + y(50).toFixed(1) +
         '" stroke="var(--merah)" stroke-width="1" stroke-dasharray="4 3" opacity=".5"/>';

    var garis = '', area = '', titik = '', label = '';
    tren.forEach(function (d, i) {
      var x = kiri + i * langkah;
      garis += (i ? 'L' : 'M') + x.toFixed(1) + ' ' + y(d.persen).toFixed(1) + ' ';
      if (i === 0) area += 'M' + x.toFixed(1) + ' ' + (H - bawah) + ' ';
      area += 'L' + x.toFixed(1) + ' ' + y(d.persen).toFixed(1) + ' ';
      if (i === n - 1) area += 'L' + x.toFixed(1) + ' ' + (H - bawah) + ' Z';

      var w = d.persen >= 75 ? '#1e8e3e' : (d.persen >= 50 ? '#f29900' : '#d93025');
      titik += '<circle cx="' + x.toFixed(1) + '" cy="' + y(d.persen).toFixed(1) + '" r="3.2" fill="' + w + '"/>';
      if (n <= 15 || i % 2 === 0) {
        label += '<text class="label-tgl" x="' + x.toFixed(1) + '" y="' + (H-10) + '" text-anchor="middle">' +
          esc(d.tanggal.slice(8,10)) + '</text>';
      }
    });
    s += '<path d="' + area + '" fill="var(--biru2)" opacity=".10"/>';
    s += '<path d="' + garis + '" fill="none" stroke="var(--biru2)" stroke-width="2.2" stroke-linejoin="round"/>';
    s += titik + label + '</svg>';
    return s;
  }

  // ---- kerangka saat memuat ----
  function kerangka() {
    $app.innerHTML =
      '<div style="background:#14476b;border-radius:14px;height:120px"></div>' +
      '<div class="kpi">' + [1,2,3,4].map(function(){ return '<div class="kartu"><div class="muat" style="width:60%"></div><div class="muat" style="width:40%;height:26px;margin-top:8px"></div></div>'; }).join('') + '</div>' +
      '<div class="kartu"><div class="muat" style="width:40%"></div><div class="muat" style="width:100%;height:140px;margin-top:10px"></div></div>';
  }

  // ---- ambil data ----
  function ambil(bulan) {
    kerangka();
    var url = '/api?action=dashboard&t=' + encodeURIComponent(token) + (bulan ? '&bulan=' + encodeURIComponent(bulan) : '');
    var kendali = new AbortController();
    var batas = setTimeout(function () { kendali.abort(); }, 20000);

    fetch(url, { signal: kendali.signal, headers: { 'Accept': 'application/json' } })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        clearTimeout(batas);
        if (!d || d.ok === false) {
          if (d && d.error === 'token_tidak_berlaku') {
            layarPesan('🔒', 'Tautan tidak berlaku',
              'Tautan ini sudah diganti atau dinonaktifkan.',
              'Minta tautan baru ke pengurus pondok.');
          } else {
            layarPesan('⚠️', 'Data belum bisa diambil',
              (d && (d.pesan || d.error)) ? String(d.pesan || d.error) : 'Terjadi kesalahan.',
              'Coba muat ulang beberapa saat lagi.');
          }
          return;
        }
        gambar(d);
      })
      .catch(function (e) {
        clearTimeout(batas);
        layarPesan('📡', 'Tidak tersambung',
          'Koneksi ke server gagal atau terlalu lama.',
          'Periksa internet lalu muat ulang halaman.');
      });
  }

  // ---- gambar halaman ----
  function gambar(d) {
    var k = d.kpi, p = d.periode, h = [];
    var waktu = new Date(d.kop.dibuat);
    var jam = ('0' + waktu.getHours()).slice(-2) + ':' + ('0' + waktu.getMinutes()).slice(-2);

    h.push('<header class="kop">');
    h.push('<div class="lembaga">' + esc(d.kop.pesantren) + '</div>');
    h.push('<h1>Dasbor Pengasuh</h1>');
    h.push('<div class="meta">' + esc(p.label) + ' · data sampai ' + Number(p.akhir.slice(8,10)) + ' ' + esc(p.label.split(' ')[0].slice(0,3)) + '</div>');
    h.push('<div class="baris"><span>Dibuka oleh ' + esc(d.kop.nama) + ' · ' + esc(String(d.kop.jabatan || '').toLowerCase()) + '</span>');
    h.push('<span class="pil">hanya baca</span></div>');
    h.push('</header>');

    // navigasi bulan
    h.push('<div class="nav">');
    h.push('<a href="?bulan=' + esc(p.sebelumnya) + '" data-bulan="' + esc(p.sebelumnya) + '">‹ ' + esc(namaBulanSingkat(p.sebelumnya)) + '</a>');
    h.push('<span class="tengah">' + esc(p.label) + '</span>');
    if (p.berjalan) {
      h.push('<a class="nonaktif">' + esc(namaBulanSingkat(p.berikutnya)) + ' ›</a>');
    } else {
      h.push('<a href="?bulan=' + esc(p.berikutnya) + '" data-bulan="' + esc(p.berikutnya) + '">' + esc(namaBulanSingkat(p.berikutnya)) + ' ›</a>');
    }
    h.push('</div>');

    // KPI
    h.push('<div class="kpi">');
    h.push(kotak('Kehadiran', k.persen + '%', '', k.hadir + ' dari ' + k.total + ' catatan', warna(k.persen)));
    h.push(kotak('Santri aktif', k.santri, 'orang', k.putra + ' putra · ' + k.putri + ' putri', 'var(--biru)'));
    h.push(kotak('Alpha', k.alpha, 'catatan', k.total ? Math.round(k.alpha / k.total * 100) + '% dari seluruh catatan' : '—', 'var(--merah)'));
    h.push(kotak('Izin &amp; sakit', k.izin, 'catatan', 'tidak dihitung mangkir', 'var(--kuning)'));
    h.push('</div>');

    // peringatan
    if (d.alert && d.alert.length) {
      var kritis = d.alert.some(function (a) { return a.tingkat === 'kritis'; });
      h.push('<div class="kartu alarm' + (kritis ? '' : ' tandai') + '">');
      h.push('<div class="t">Perlu perhatian — ' + d.alert.length + ' temuan 3 hari terakhir</div>');
      d.alert.slice(0, 6).forEach(function (a) {
        h.push('<div class="item"><b>' + esc(a.judul) + '</b><span class="d">' + esc(a.detail) + '</span></div>');
      });
      h.push('<div class="kaki">Pilihannya: pengurus belum mencatat, atau santri memang tidak mengikuti kegiatannya.</div>');
      h.push('</div>');
    } else {
      h.push('<div class="bersih">✓ Tidak ada kegiatan yang turun di bawah ambang 3 hari terakhir.</div>');
    }

    // per aktivitas
    h.push('<div class="kartu"><div class="judul">Kehadiran per kegiatan</div>');
    h.push('<div class="sub" style="margin-bottom:8px">Shalat dan kajian dipisah — supaya kelihatan kalau jamaah penuh tapi kajian kosong.</div>');
    if (d.perAktivitas.length) {
      d.perAktivitas.forEach(function (a) {
        h.push(bar(a.label, a.persen, a.hadir + ' hadir · ' + a.alpha + ' alpha' + (a.izin ? ' · ' + a.izin + ' izin' : '')));
      });
    } else {
      h.push('<div class="kosong">Belum ada catatan pada periode ini.</div>');
    }
    h.push('</div>');

    // tren
    h.push('<div class="kartu"><div class="judul">Tren 14 hari terakhir</div>');
    h.push('<div class="sub" style="margin-bottom:4px">Garis putus-putus = ambang 50%. Titik merah berarti hari itu di bawah ambang.</div>');
    h.push(grafikTren(d.tren));
    h.push('</div>');

    // kelompok
    h.push('<div class="kartu"><div class="judul" style="margin-bottom:8px">Putra dan putri</div>');
    d.kelompok.forEach(function (g) {
      var cara = g.mode ? ('dicatat dengan cara ' + (g.mode === 'PANTAU' ? 'diamati' : 'dinyatakan')) : '';
      h.push(bar(g.nama, g.persen, g.hadir + ' hadir · ' + g.alpha + ' alpha' + (cara ? ' · ' + cara : '')));
    });
    h.push('<div class="sub">Angka dua kelompok tidak selalu sebanding: yang satu diamati langsung, yang lain dinyatakan setelah sesi.</div>');
    h.push('</div>');

    // kepatuhan pencatatan
    if (d.catat && d.catat.wajib) {
      h.push('<div class="kartu"><div class="judul" style="margin-bottom:8px">Ketertiban pencatatan</div>');
      h.push(bar('Sesi yang dibereskan pengurus', d.catat.persen,
        d.catat.beres + ' dari ' + d.catat.wajib + ' sesi seharusnya'));
      h.push('<div class="sub">Sesi yang belum dibereskan tidak dihitung sebagai hadir.</div>');
      h.push('</div>');
    }

    // keuangan
    h.push('<div class="kartu"><div class="judul" style="margin-bottom:10px">Keuangan ' + esc(p.label) + '</div>');
    if (d.uang && d.uang.ada) {
      h.push('<div class="kpi" style="margin-top:0">');
      h.push(kotak('Tagihan', rupiah(d.uang.tagihan), '', 'periode ini', 'var(--biru)'));
      h.push(kotak('Diterima', rupiah(d.uang.diterima), '', 'pembayaran masuk', 'var(--hijau)'));
      h.push(kotak('Tunggakan', rupiah(d.uang.tunggakan), '', 'seluruh santri', 'var(--merah)'));
      h.push(kotak('Lunas', d.uang.lunas, 'santri', d.uang.kurang + ' masih kurang', 'var(--biru)'));
      h.push('</div>');
    } else {
      h.push('<div class="kosong">Data keuangan belum tersedia.</div>');
    }
    h.push('</div>');

    // perizinan
    h.push('<div class="kartu"><div class="judul" style="margin-bottom:8px">Perizinan</div>');
    if (d.izin && d.izin.length) {
      d.izin.forEach(function (i) {
        h.push(bar(i.label, i.persen, i.jumlah + ' izin · ' + i.sesi + ' sesi · ' + i.santri + ' santri', 'var(--biru2)'));
      });
    } else {
      h.push('<div class="kosong">Tidak ada izin pada periode ini.</div>');
    }
    h.push('</div>');

    // terendah
    if (d.terendah && d.terendah.length) {
      h.push('<div class="kartu"><div class="judul" style="margin-bottom:6px">Kehadiran terendah</div>');
      d.terendah.forEach(function (s) {
        h.push('<div class="baris-daftar"><span>' + esc(s.nama) +
          ' <span class="ket" style="color:var(--abu);font-size:11.5px">· ' + esc(s.kamar) + '</span></span>' +
          '<span class="kanan" style="color:' + warna(s.persen) + '">' + s.persen + '%' +
          ' <span class="ket">· ' + s.alpha + ' alpha</span></span></div>');
      });
      h.push('</div>');
    }

    h.push('<footer>Halaman ini hanya untuk dibaca — tidak ada data yang bisa diubah dari sini.<br>' +
      '<b>' + esc(d.kop.pesantren) + '</b> · diperbarui ' + esc(jam) + ' WIB' +
      '<div class="cetak"><button class="tombol-cetak" onclick="window.print()">Cetak / simpan PDF</button></div>' +
      '</footer>');

    $app.innerHTML = h.join('');

    // navigasi bulan tanpa memuat ulang halaman
    Array.prototype.forEach.call($app.querySelectorAll('a[data-bulan]'), function (a) {
      a.addEventListener('click', function (ev) {
        ev.preventDefault();
        var b = a.getAttribute('data-bulan');
        if (history.pushState) history.pushState({}, '', '?bulan=' + b);
        ambil(b);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
    });
  }

  function kotak(label, angka, satuan, ket, w) {
    return '<div class="kartu"><div class="label">' + label + '</div>' +
      '<div class="angka" style="color:' + w + '">' + esc(angka) +
      (satuan ? '<span> ' + esc(satuan) + '</span>' : '') + '</div>' +
      '<div class="ket">' + esc(ket) + '</div></div>';
  }

  ambil(bulan);
})();
</script>
