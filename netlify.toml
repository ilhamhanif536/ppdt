[build]
  command = "npm run build"
  publish = "dist"

# Header keamanan dasar untuk semua respons
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# CSS/JS memiliki fingerprint (nama file ber-hash) di build.mjs,
# sehingga cache 1 tahun aman — perubahan selalu terlihat.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Gambar dapat diganti kapan saja (mis. logo resmi), jadi cache pendek.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"
